version: '3.8'

services:
  # PostgreSQL Adatbázis
  postgres:
    image: postgres:16-alpine
    container_name: pathly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: pathly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pathly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathly-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pathly
      DB_USER: postgres
      DB_PASSWORD: postgres123
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pathly-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathly-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pathly-network

volumes:
  postgres_data:

networks:
  pathly-network:
    driver: bridge
